<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiroween 2026</title>
    <style>
      /* ── Reset and base ─────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --ground:  #120f14;
        --text:    #d8ccbe;
        --subtle:  #7a6e62;
        --accent:  #e0b86a;
        --border:  #2a2230;
        --canvas-bg: #0e0b10;
      }

      html {
        scroll-behavior: smooth;
      }

      html, body {
        background: var(--ground);
        color: var(--text);
        font-family: 'Georgia', serif;
        line-height: 1.6;
      }

      /* ── Layout ─────────────────────────────────────────────────────────── */
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 3rem 1.5rem 6rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        /* min-height is extended by main.ts to accommodate scroll stages */
      }

      /* ── Scope statement ────────────────────────────────────────────────── */
      .scope {
        border-left: 3px solid var(--accent);
        padding: 0.75rem 1.25rem;
        font-size: 1.05rem;
        color: var(--text);
        max-width: 640px;
      }

      .scope strong {
        color: var(--accent);
        font-weight: normal;
        font-style: normal;
      }

      /* ── Textarea ───────────────────────────────────────────────────────── */
      label[for="claim-input"] {
        display: block;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--subtle);
        margin-bottom: 0.5rem;
      }

      #claim-input {
        display: block;
        width: 100%;
        max-width: 640px;
        min-height: 10rem;
        background: #0a080c;
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.6;
        padding: 0.75rem 1rem;
        resize: vertical;
        outline: none;
        transition: border-color 0.2s;
      }

      #claim-input:focus {
        border-color: var(--accent);
      }

      #claim-input::placeholder {
        color: var(--subtle);
        opacity: 0.7;
      }

      /* ── Canvas — sticky so it stays in view during scroll reveal ───────── */
      .canvas-wrapper {
        position: sticky;
        top: 1.5rem;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--canvas-bg);
        border: 1px solid var(--border);
        border-radius: 2px;
        overflow: hidden;
        /* Ensure the canvas sits above the scroll extension area */
        z-index: 1;
      }

      #figure-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ── Scroll hint ─────────────────────────────────────────────────────── */
      /*
       * Shown below the canvas. Reminds the user to scroll to see the reveal.
       * Fades out once the user has scrolled past the initial viewport.
       */
      .scroll-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0 0;
        color: var(--subtle);
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        user-select: none;
        pointer-events: none;
      }

      .scroll-hint-arrow {
        display: block;
        width: 1px;
        height: 2rem;
        background: linear-gradient(to bottom, transparent, var(--subtle));
        margin: 0 auto;
      }

      /* ── Scroll-reveal progress label ───────────────────────────────────── */
      /*
       * A small status line beneath the canvas that names the layer being
       * revealed. Driven by main.ts via data attributes.
       */
      .reveal-status {
        min-height: 1.4rem;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--subtle);
        text-align: center;
        padding-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main class="page" id="page-main">

      <!-- Scope statement — visible on load, verbatim from REGISTERS.md §5 -->
      <p class="scope">
        This checks whether the evidence a claim needs is <strong>present</strong>.
        It does not judge whether that evidence is any good.
        A specification can be present and wrong and this will credit it.
      </p>

      <!-- Claim input -->
      <div>
        <label for="claim-input">Paste a document</label>
        <textarea
          id="claim-input"
          spellcheck="false"
          placeholder="Paste a document here. A specification, a product description, a technical proposal."
        ></textarea>
      </div>

      <!-- WebGL figure — sticky so it stays visible while scrolling -->
      <div class="canvas-wrapper">
        <canvas id="figure-canvas"></canvas>
      </div>

      <!-- Reveal status line (updated by main.ts) -->
      <p class="reveal-status" id="reveal-status" aria-live="polite"></p>

      <!-- Scroll hint below canvas -->
      <div class="scroll-hint" aria-hidden="true">
        <span class="scroll-hint-arrow"></span>
        <span>Scroll to reveal</span>
      </div>

    </main>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
